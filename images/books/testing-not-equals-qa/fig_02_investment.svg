<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <rect width="740" height="300" fill="#ffffff"/>

  <!-- Title -->
  <text x="370" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">投資配分の比較</text>

  <!-- Debt-laden org -->
  <text x="80" y="92" font-size="14" font-weight="bold" fill="#333">負債あり</text>
  <rect x="170" y="72" width="468" height="36" rx="3" fill="#2980B9"/>
  <text x="404" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">テスト実行 90%</text>
  <rect x="638" y="72" width="52" height="36" rx="3" fill="#27AE60"/>
  <text x="664" y="96" text-anchor="middle" font-size="11" fill="#fff">QC</text>

  <text x="700" y="92" font-size="11" fill="#E67E22">QA 0%</text>

  <!-- Arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C"/>
    </marker>
  </defs>
  <path d="M370 125 L370 145" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Debt-free org -->
  <text x="80" y="180" font-size="14" font-weight="bold" fill="#333">返済後</text>
  <rect x="170" y="160" width="170" height="36" rx="3" fill="#2980B9"/>
  <text x="255" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">テスト 33%</text>
  <rect x="340" y="160" width="170" height="36" rx="3" fill="#27AE60"/>
  <text x="425" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">QC 33%</text>
  <rect x="510" y="160" width="180" height="36" rx="3" fill="#E67E22"/>
  <text x="600" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">QA 34%</text>

  <!-- Explanation -->
  <text x="370" y="230" text-anchor="middle" font-size="13" fill="#555">負債のある組織: リソースの大半がテスト実行に吸い込まれる</text>
  <text x="370" y="253" text-anchor="middle" font-size="13" fill="#555">返済した組織: テスト・QC・QAにバランスよく投資できる</text>

  <!-- Note -->
  <text x="370" y="285" text-anchor="middle" font-size="11" fill="#999">※「正解」の配分はチームやプロダクトの状況で変わる</text>
</svg>
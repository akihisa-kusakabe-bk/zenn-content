<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="780" height="340" fill="#ffffff"/>

  <!-- Title -->
  <text x="390" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">品質サイクル接続フロー</text>

  <!-- Forward chain (top row) -->
  <!-- 品質方針 -->
  <rect x="20" y="70" width="120" height="50" rx="6" fill="#E8F5E9" stroke="#F9A825" stroke-width="2"/>
  <text x="80" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">品質方針</text>

  <!-- Arrow -->
  <line x1="140" y1="95" x2="170" y2="95" stroke="#78909C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- テスト戦略 -->
  <rect x="170" y="70" width="120" height="50" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="230" y="100" text-anchor="middle" font-size="13" fill="#1a1a1a">テスト戦略</text>

  <!-- Arrow -->
  <line x1="290" y1="95" x2="320" y2="95" stroke="#78909C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- テスト観点カタログ -->
  <rect x="320" y="62" width="140" height="66" rx="6" fill="#E8F5E9" stroke="#F9A825" stroke-width="2"/>
  <text x="390" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">テスト観点</text>
  <text x="390" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">カタログ</text>

  <!-- Arrow -->
  <line x1="460" y1="95" x2="490" y2="95" stroke="#78909C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- テスト設計 -->
  <rect x="490" y="70" width="120" height="50" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="550" y="100" text-anchor="middle" font-size="13" fill="#1a1a1a">テスト設計</text>

  <!-- Arrow -->
  <line x1="610" y1="95" x2="640" y2="95" stroke="#78909C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- テスト実行 -->
  <rect x="640" y="70" width="120" height="50" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="700" y="100" text-anchor="middle" font-size="13" fill="#1a1a1a">テスト実行</text>

  <!-- Feedback return path (bottom) -->
  <!-- Down from テスト実行 -->
  <line x1="700" y1="120" x2="700" y2="200" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- バグ発見 -->
  <rect x="640" y="200" width="120" height="44" rx="6" fill="#f0f0f0" stroke="#78909C" stroke-width="1.5"/>
  <text x="700" y="227" text-anchor="middle" font-size="13" fill="#1a1a1a">バグ発見</text>

  <!-- Arrow left -->
  <line x1="640" y1="222" x2="610" y2="222" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow-back)"/>

  <!-- QC（修正） -->
  <rect x="490" y="200" width="120" height="44" rx="6" fill="#f0f0f0" stroke="#78909C" stroke-width="1.5"/>
  <text x="550" y="227" text-anchor="middle" font-size="13" fill="#1a1a1a">QC（修正）</text>

  <!-- Arrow left -->
  <line x1="490" y1="222" x2="460" y2="222" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow-back)"/>

  <!-- バグ分析 -->
  <rect x="320" y="200" width="140" height="44" rx="6" fill="#f0f0f0" stroke="#78909C" stroke-width="1.5"/>
  <text x="390" y="227" text-anchor="middle" font-size="13" fill="#1a1a1a">バグ分析</text>

  <!-- Arrow left to 品質方針 -->
  <path d="M 320 222 L 80 222 L 80 120" fill="none" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow up to カタログ -->
  <line x1="390" y1="200" x2="390" y2="128" stroke="#78909C" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="390" y="165" text-anchor="middle" font-size="11" fill="#666">観点の追加・更新</text>
  <text x="55" y="172" text-anchor="middle" font-size="11" fill="#666">方針の見直し</text>

  <!-- Legend -->
  <line x1="200" y1="305" x2="240" y2="305" stroke="#78909C" stroke-width="1.5"/>
  <text x="250" y="310" font-size="12" fill="#666">順方向の流れ</text>
  <line x1="400" y1="305" x2="440" y2="305" stroke="#78909C" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="450" y="310" font-size="12" fill="#666">フィードバック</text>
</svg>
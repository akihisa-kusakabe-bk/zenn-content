<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <rect width="740" height="320" fill="#ffffff"/>

  <!-- Title -->
  <text x="370" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">品質定義ワークショップ（90分）</text>

  <!-- Step 1 -->
  <rect x="40" y="70" width="190" height="160" rx="8" fill="#F9A825" stroke="#EC407A" stroke-width="2"/>
  <text x="135" y="98" text-anchor="middle" font-size="11" fill="#F5F5F5">STEP 1（30分）</text>
  <text x="135" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">品質特性を</text>
  <text x="135" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">知る</text>
  <text x="135" y="172" text-anchor="middle" font-size="11" fill="#F5F5F5">ISO 25010の</text>
  <text x="135" y="188" text-anchor="middle" font-size="11" fill="#F5F5F5">8つの品質特性を</text>
  <text x="135" y="204" text-anchor="middle" font-size="11" fill="#F5F5F5">自プロダクトで解釈</text>

  <!-- Arrow 1→2 -->
  <path d="M240 150 L270 150" stroke="#EC407A" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- Step 2 -->
  <rect x="275" y="70" width="190" height="160" rx="8" fill="#27AE60" stroke="#EC407A" stroke-width="2"/>
  <text x="370" y="98" text-anchor="middle" font-size="11" fill="#F5F5F5">STEP 2（30分）</text>
  <text x="370" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">優先順位を</text>
  <text x="370" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">決める</text>
  <text x="370" y="172" text-anchor="middle" font-size="11" fill="#F5F5F5">チームで投票して</text>
  <text x="370" y="188" text-anchor="middle" font-size="11" fill="#ddd">Top 3を選ぶ</text>
  <text x="370" y="204" text-anchor="middle" font-size="11" fill="#ddd">（ドット投票）</text>

  <!-- Arrow 2→3 -->
  <path d="M475 150 L505 150" stroke="#EC407A" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- Step 3 -->
  <rect x="510" y="70" width="190" height="160" rx="8" fill="#EC407A" stroke="#EC407A" stroke-width="2"/>
  <text x="605" y="98" text-anchor="middle" font-size="11" fill="#FCE4EC">STEP 3（30分）</text>
  <text x="605" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">品質方針を</text>
  <text x="605" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">書く</text>
  <text x="605" y="172" text-anchor="middle" font-size="11" fill="#FCE4EC">A4一枚の</text>
  <text x="605" y="188" text-anchor="middle" font-size="11" fill="#FCE4EC">品質方針を</text>
  <text x="605" y="204" text-anchor="middle" font-size="11" fill="#eee">チームで言語化</text>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EC407A"/>
    </marker>
  </defs>

  <!-- Output -->
  <rect x="220" y="255" width="300" height="40" rx="6" fill="#EC407A"/>
  <text x="370" y="281" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">成果物: A4一枚の品質方針</text>

  <!-- Arrow from Step3 to Output -->
  <path d="M605 230 L605 260 L520 275" stroke="#EC407A" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
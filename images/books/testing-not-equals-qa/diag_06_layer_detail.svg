<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <rect width="780" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrowL2" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#F9A825"/>
    </marker>
    <marker id="arrowR2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#F9A825"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">ロール × レイヤーマトリクス（詳細版）</text>

  <g transform="translate(30, 56)">
    <!-- Column headers -->
    <rect x="190" y="0" width="180" height="36" rx="4" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
    <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Dev</text>
    <rect x="370" y="0" width="180" height="36" rx="4" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
    <text x="460" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">QA</text>
    <rect x="550" y="0" width="180" height="36" rx="4" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
    <text x="640" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">PO</text>

    <!-- Row 1: 設計レイヤー (lightest) -->
    <rect x="0" y="40" width="190" height="100" rx="4" fill="#f8f8f8" stroke="#78909C" stroke-width="1.5"/>
    <text x="95" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">設計レイヤー</text>
    <text x="95" y="96" text-anchor="middle" font-size="11" fill="#777">（人間固有）</text>

    <rect x="190" y="40" width="180" height="100" rx="4" fill="#f8f8f8" stroke="#78909C" stroke-width="1.5"/>
    <text x="280" y="78" text-anchor="middle" font-size="13" fill="#1a1a1a">アーキテクチャ</text>
    <text x="280" y="98" text-anchor="middle" font-size="13" fill="#1a1a1a">技術選定</text>

    <rect x="370" y="40" width="180" height="100" rx="4" fill="#f8f8f8" stroke="#78909C" stroke-width="1.5"/>
    <text x="460" y="70" text-anchor="middle" font-size="13" fill="#1a1a1a">品質戦略</text>
    <text x="460" y="90" text-anchor="middle" font-size="13" fill="#1a1a1a">品質定義</text>
    <text x="460" y="110" text-anchor="middle" font-size="13" fill="#1a1a1a">テスト戦略</text>

    <rect x="550" y="40" width="180" height="100" rx="4" fill="#f8f8f8" stroke="#78909C" stroke-width="1.5"/>
    <text x="640" y="78" text-anchor="middle" font-size="13" fill="#1a1a1a">ビジョン</text>
    <text x="640" y="98" text-anchor="middle" font-size="13" fill="#1a1a1a">ロードマップ</text>

    <!-- Row 2: 判断レイヤー (medium) -->
    <rect x="0" y="140" width="190" height="100" rx="4" fill="#FFF8E1" stroke="#78909C" stroke-width="1.5"/>
    <text x="95" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">判断レイヤー</text>
    <text x="95" y="196" text-anchor="middle" font-size="11" fill="#777">（人間+AI）</text>

    <rect x="190" y="140" width="180" height="100" rx="4" fill="#FFF8E1" stroke="#78909C" stroke-width="1.5"/>
    <text x="280" y="170" text-anchor="middle" font-size="13" fill="#1a1a1a">コードレビュー</text>
    <text x="280" y="190" text-anchor="middle" font-size="13" fill="#1a1a1a">障害対応</text>
    <text x="280" y="210" text-anchor="middle" font-size="13" fill="#1a1a1a">設計判断</text>

    <rect x="370" y="140" width="180" height="100" rx="4" fill="#FFF8E1" stroke="#78909C" stroke-width="1.5"/>
    <text x="460" y="170" text-anchor="middle" font-size="13" fill="#1a1a1a">リスク判断</text>
    <text x="460" y="190" text-anchor="middle" font-size="13" fill="#1a1a1a">品質判断</text>
    <text x="460" y="210" text-anchor="middle" font-size="13" fill="#1a1a1a">テスト設計</text>

    <rect x="550" y="140" width="180" height="100" rx="4" fill="#e8e8e8" stroke="#78909C" stroke-width="1.5"/>
    <text x="640" y="170" text-anchor="middle" font-size="13" fill="#1a1a1a">優先順位判断</text>
    <text x="640" y="190" text-anchor="middle" font-size="13" fill="#1a1a1a">機能取捨選択</text>
    <text x="640" y="210" text-anchor="middle" font-size="13" fill="#1a1a1a">要件判断</text>

    <!-- Dashed boundary line -->
    <line x1="190" y1="240" x2="730" y2="240" stroke="#7E57C2" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Row 3: 実行レイヤー (darkest) -->
    <rect x="0" y="240" width="190" height="100" rx="4" fill="#FFF8E1" stroke="#78909C" stroke-width="1.5"/>
    <text x="95" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">実行レイヤー</text>
    <text x="95" y="296" text-anchor="middle" font-size="11" fill="#555">（AI化済み）</text>

    <rect x="190" y="240" width="180" height="100" rx="4" fill="#FFF8E1" stroke="#78909C" stroke-width="1.5"/>
    <text x="280" y="270" text-anchor="middle" font-size="13" fill="#333">コーディング</text>
    <text x="280" y="290" text-anchor="middle" font-size="13" fill="#333">リファクタ</text>
    <text x="280" y="310" text-anchor="middle" font-size="13" fill="#333">テスト実装</text>

    <rect x="370" y="240" width="180" height="100" rx="4" fill="#FFF8E1" stroke="#78909C" stroke-width="1.5"/>
    <text x="460" y="270" text-anchor="middle" font-size="13" fill="#333">テスト実行</text>
    <text x="460" y="290" text-anchor="middle" font-size="13" fill="#333">TC生成</text>
    <text x="460" y="310" text-anchor="middle" font-size="13" fill="#333">テストデータ</text>

    <rect x="550" y="240" width="180" height="100" rx="4" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
    <text x="640" y="270" text-anchor="middle" font-size="13" fill="#333">調査・データ</text>
    <text x="640" y="290" text-anchor="middle" font-size="13" fill="#333">PRD下書き</text>
    <text x="640" y="310" text-anchor="middle" font-size="13" fill="#333">議事録</text>

    <!-- Bottom annotation arrow -->
    <line x1="190" y1="380" x2="730" y2="380" stroke="#78909C" stroke-width="1.5" marker-start="url(#arrowL2)" marker-end="url(#arrowR2)"/>
    <text x="460" y="410" text-anchor="middle" font-size="13" fill="#555">AI化の波はロール横断で実行レイヤーを飲み込む</text>
  </g>
</svg>
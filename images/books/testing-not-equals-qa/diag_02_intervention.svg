<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#F9A825"/>
    </marker>
  </defs>

  <rect width="750" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="375" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">介入ポイント</text>

  <!-- Debt 2 -->
  <rect x="40" y="70" width="280" height="70" rx="8" fill="#F5F5F5" stroke="#E74C3C" stroke-width="2"/>
  <text x="180" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">負債2: 上流空白</text>
  <text x="180" y="120" text-anchor="middle" font-size="12" fill="#555">品質活動が開発後半に偏る</text>

  <!-- Scissors + cut line 1 -->
  <line x1="340" y1="105" x2="430" y2="105" stroke="#78909C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="385" y="90" text-anchor="middle" font-size="22">&#x2702;</text>

  <!-- Intervention 1 -->
  <rect x="440" y="70" width="270" height="70" rx="8" fill="none" stroke="#78909C" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="575" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">第4章</text>
  <text x="575" y="120" text-anchor="middle" font-size="13" fill="#555">品質定義ワークショップ</text>

  <!-- Arrow down -->
  <line x1="180" y1="140" x2="180" y2="190" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Debt 3 -->
  <rect x="40" y="200" width="280" height="70" rx="8" fill="#F5F5F5" stroke="#E74C3C" stroke-width="2"/>
  <text x="180" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">負債3: テスト工数膨張</text>
  <text x="180" y="250" text-anchor="middle" font-size="12" fill="#555">テスト＝品質投資という誤認</text>

  <!-- Scissors + cut line 2 -->
  <line x1="340" y1="235" x2="430" y2="235" stroke="#78909C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="385" y="220" text-anchor="middle" font-size="22">&#x2702;</text>

  <!-- Intervention 2 -->
  <rect x="440" y="200" width="270" height="70" rx="8" fill="none" stroke="#78909C" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="575" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">第5章</text>
  <text x="575" y="250" text-anchor="middle" font-size="13" fill="#555">テスト戦略</text>

  <!-- Arrow down -->
  <line x1="180" y1="270" x2="180" y2="320" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Debt 1 -->
  <rect x="40" y="330" width="280" height="70" rx="8" fill="#F5F5F5" stroke="#E74C3C" stroke-width="2"/>
  <text x="180" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">負債1: 門番化</text>
  <text x="180" y="380" text-anchor="middle" font-size="12" fill="#555">QA＝最後の砦という固定観念</text>

  <!-- Scissors + cut line 3 -->
  <line x1="340" y1="365" x2="430" y2="365" stroke="#78909C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="385" y="350" text-anchor="middle" font-size="22">&#x2702;</text>

  <!-- Intervention 3 -->
  <rect x="440" y="330" width="270" height="70" rx="8" fill="none" stroke="#78909C" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="575" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">第3章</text>
  <text x="575" y="380" text-anchor="middle" font-size="13" fill="#555">QA活動カタログ</text>

  <!-- Loop back arrow -->
  <path d="M 40 365 L 15 365 L 15 105 L 40 105" fill="none" stroke="#E74C3C" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="15" y="240" text-anchor="middle" font-size="11" fill="#999" transform="rotate(-90, 15, 240)">循環</text>

  <!-- Bottom annotation -->
  <text x="375" y="440" text-anchor="middle" font-size="13" fill="#555">点線ボックス = 本書で提供する介入手段</text>
  <text x="375" y="462" text-anchor="middle" font-size="13" fill="#555">各章が負債の循環を断ち切るポイントに対応</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 1050" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif">
  <defs>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #111; }
      .section-label { font-size: 13px; fill: #888; font-weight: 500; }
    </style>
  </defs>

  <rect width="740" height="1050" fill="#fff"/>

  <!-- Title -->
  <text x="370" y="48" text-anchor="middle" class="title">テスト / QC / QA の3層モデル</text>
  <text x="370" y="75" text-anchor="middle" class="section-label">— 第1章の核心：テスト ⊂ QC ⊂ QA —</text>

  <!-- ===== Venn diagram with offset circles ===== -->
  <!-- QA: largest, positioned highest -->
  <circle cx="340" cy="340" r="260" fill="#E0E0E0" stroke="#E67E22" stroke-width="2.5"/>

  <!-- QC: medium, offset down -->
  <circle cx="340" cy="410" r="185" fill="#E8F5E9" stroke="#444" stroke-width="2"/>

  <!-- Testing: smallest, offset further down -->
  <circle cx="340" cy="490" r="110" fill="#E8F5E9" stroke="#222" stroke-width="2"/>

  <!-- QA label (in the top area unique to QA) -->
  <text x="340" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#222">QA（品質保証）</text>
  <text x="340" y="157" text-anchor="middle" font-size="15" fill="#444">＝ 仕込む</text>
  <text x="340" y="182" text-anchor="middle" font-size="12" fill="#555">良いものが生まれる仕組みをつくる</text>

  <!-- QA activities (top ring area) -->
  <text x="200" y="210" text-anchor="middle" font-size="11" fill="#555">プロセス改善</text>
  <text x="480" y="210" text-anchor="middle" font-size="11" fill="#555">品質ゲート設計</text>
  <text x="200" y="232" text-anchor="middle" font-size="11" fill="#555">品質方針の策定</text>
  <text x="480" y="232" text-anchor="middle" font-size="11" fill="#555">テスト戦略策定</text>

  <!-- QC label (in the ring area unique to QC) -->
  <text x="340" y="268" text-anchor="middle" font-size="19" font-weight="700" fill="#222">QC（品質管理）</text>
  <text x="340" y="293" text-anchor="middle" font-size="14" fill="#333">＝ 診る</text>
  <text x="340" y="316" text-anchor="middle" font-size="12" fill="#444">品質の状態を把握し制御する</text>

  <!-- QC activities (middle ring area, left and right) -->
  <text x="210" y="365" text-anchor="middle" font-size="11" fill="#444">バグ修正</text>
  <text x="470" y="365" text-anchor="middle" font-size="11" fill="#444">原因分析</text>
  <text x="210" y="387" text-anchor="middle" font-size="11" fill="#444">再テスト</text>
  <text x="470" y="387" text-anchor="middle" font-size="11" fill="#444">リリース判定</text>

  <!-- Testing label (center of inner circle) -->
  <text x="340" y="465" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">テスト（テスト実行）</text>
  <text x="340" y="492" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.9)">＝ 測る</text>
  <text x="340" y="518" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.8)">今の状態を確認する</text>

  <!-- Testing activities -->
  <text x="340" y="548" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)">テスト実施 ／ バグ発見</text>
  <text x="340" y="568" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)">単体・結合・システムテスト</text>

  <!-- ===== 勉強のたとえ (right side) ===== -->
  <rect x="615" y="260" width="110" height="200" rx="8" fill="none" stroke="#BBB" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="670" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#444">勉強のたとえ</text>

  <rect x="625" y="300" width="90" height="40" rx="6" fill="#E0E0E0"/>
  <text x="670" y="317" text-anchor="middle" font-size="11" font-weight="600" fill="#333">QA</text>
  <text x="670" y="333" text-anchor="middle" font-size="10" fill="#555">勉強法を改善</text>

  <rect x="625" y="350" width="90" height="40" rx="6" fill="#E8F5E9"/>
  <text x="670" y="367" text-anchor="middle" font-size="11" font-weight="600" fill="#333">QC</text>
  <text x="670" y="383" text-anchor="middle" font-size="10" fill="#444">学力の傾向を把握</text>

  <rect x="625" y="400" width="90" height="40" rx="6" fill="#E8F5E9"/>
  <text x="670" y="417" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">テスト</text>
  <text x="670" y="433" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">過去問を解く</text>

  <!-- ===== Bottom: the problem + key message ===== -->
  <rect x="60" y="660" width="620" height="140" rx="10" fill="#F5F5F5" stroke="#CCC" stroke-width="1"/>
  <text x="370" y="692" text-anchor="middle" font-size="15" font-weight="700" fill="#333">多くの組織の現実</text>

  <!-- Stacked bar: テスト80% + QC20% + QA0% -->
  <rect x="110" y="710" width="400" height="24" rx="4" fill="#E3F2FD"/>
  <text x="310" y="727" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">テスト 80%</text>
  <rect x="510" y="710" width="100" height="24" rx="4" fill="#E3F2FD"/>
  <text x="560" y="727" text-anchor="middle" font-size="12" font-weight="600" fill="#333">QC 20%</text>

  <!-- QA 0% label -->
  <text x="630" y="727" font-size="11" fill="#AAA">QA 0%</text>

  <!-- Annotation -->
  <text x="370" y="760" text-anchor="middle" font-size="12" fill="#666">テスト実行に80%を費やし、QA活動がゼロの組織が多い</text>
  <text x="370" y="780" text-anchor="middle" font-size="11" fill="#E3F2FD">本書が目指す → テスト・QC・QAの3層すべてに投資する</text>

  <!-- Key message box -->
  <rect x="80" y="820" width="580" height="55" rx="10" fill="#222"/>
  <text x="370" y="845" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">テスト ⊂ QC ⊂ QA</text>
  <text x="370" y="867" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.8)">テストはQAの一部であり、QAそのものではない</text>

  <!-- Page reference -->
  <text x="370" y="1000" text-anchor="middle" font-size="11" fill="#AAA">『QA＝テストではない』チートシート ①</text>
</svg>
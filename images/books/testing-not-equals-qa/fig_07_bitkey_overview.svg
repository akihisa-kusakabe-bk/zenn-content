<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <rect width="740" height="320" fill="#ffffff"/>

  <text x="370" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">ビットキーの品質上の特殊性</text>

  <!-- 5 product layers -->
  <text x="370" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">5つのレイヤーをまたぐプロダクト</text>

  <rect x="30" y="90" width="128" height="50" rx="6" fill="#F9A825"/>
  <text x="94" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">アプリ</text>

  <rect x="168" y="90" width="128" height="50" rx="6" fill="#00897B"/>
  <text x="232" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">クラウド</text>

  <rect x="306" y="90" width="128" height="50" rx="6" fill="#2980B9"/>
  <text x="370" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">FW</text>

  <rect x="444" y="90" width="128" height="50" rx="6" fill="#F5F5F5"/>
  <text x="508" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">HW</text>

  <rect x="582" y="90" width="128" height="50" rx="6" fill="#00897B"/>
  <text x="646" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">BLE通信</text>

  <!-- Risk comparison -->
  <text x="370" y="185" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">バグの影響</text>

  <rect x="50" y="200" width="290" height="50" rx="8" fill="#E0F2F1" stroke="#bbb" stroke-width="1.5"/>
  <text x="195" y="231" text-anchor="middle" font-size="15" fill="#666">Webアプリ → リロードで直る</text>

  <rect x="400" y="200" width="290" height="50" rx="8" fill="#F9A825" stroke="#00897B" stroke-width="1.5"/>
  <text x="545" y="231" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">スマートロック → 締め出し</text>

  <text x="370" y="295" text-anchor="middle" font-size="15" fill="#555">この特殊性が品質戦略を形づくっている</text>
</svg>
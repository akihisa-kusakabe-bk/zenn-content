<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="390" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">テスト／QCダブルループ</text>

  <!-- Center hub -->
  <rect x="290" y="175" width="200" height="60" rx="8" fill="#E8F5E9" stroke="#F9A825" stroke-width="2"/>
  <text x="390" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">テスト観点カタログ</text>
  <text x="390" y="222" text-anchor="middle" font-size="11" fill="#666">（ハブ）</text>

  <!-- ===== Left loop: テストループ ===== -->
  <text x="160" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">テストループ</text>

  <!-- テスト設計 (top-left) -->
  <rect x="60" y="90" width="130" height="44" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="125" y="117" text-anchor="middle" font-size="13" fill="#1a1a1a">テスト設計</text>

  <!-- テスト実行 (left) -->
  <rect x="20" y="185" width="130" height="44" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="85" y="212" text-anchor="middle" font-size="13" fill="#1a1a1a">テスト実行</text>

  <!-- 結果記録 (bottom-left) -->
  <rect x="60" y="280" width="130" height="44" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="125" y="307" text-anchor="middle" font-size="13" fill="#1a1a1a">結果記録</text>

  <!-- 観点更新 (top-center-left) -->
  <rect x="220" y="90" width="130" height="44" rx="6" fill="#f0f0f0" stroke="#78909C" stroke-width="1.5"/>
  <text x="285" y="117" text-anchor="middle" font-size="13" fill="#1a1a1a">観点更新</text>

  <!-- Left loop arrows -->
  <!-- テスト設計 → テスト実行 -->
  <line x1="75" y1="134" x2="75" y2="185" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- テスト実行 → 結果記録 -->
  <line x1="100" y1="229" x2="110" y2="280" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 結果記録 → 観点更新 -->
  <path d="M 190 295 Q 260 340 285 324" fill="none" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 観点更新 → テスト設計 -->
  <line x1="220" y1="112" x2="190" y2="112" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 観点更新 → Hub -->
  <line x1="310" y1="134" x2="340" y2="175" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Right loop: QCループ ===== -->
  <text x="620" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">QCループ</text>

  <!-- バグ報告 (top-right) -->
  <rect x="570" y="90" width="130" height="44" rx="6" fill="#f0f0f0" stroke="#78909C" stroke-width="1.5"/>
  <text x="635" y="117" text-anchor="middle" font-size="13" fill="#1a1a1a">バグ報告</text>

  <!-- 原因分析 (right) -->
  <rect x="630" y="185" width="130" height="44" rx="6" fill="#f0f0f0" stroke="#78909C" stroke-width="1.5"/>
  <text x="695" y="212" text-anchor="middle" font-size="13" fill="#1a1a1a">原因分析</text>

  <!-- バグ修正 (bottom-right) -->
  <rect x="570" y="280" width="130" height="44" rx="6" fill="#f0f0f0" stroke="#78909C" stroke-width="1.5"/>
  <text x="635" y="307" text-anchor="middle" font-size="13" fill="#1a1a1a">バグ修正</text>

  <!-- 再テスト (top-center-right) -->
  <rect x="430" y="90" width="130" height="44" rx="6" fill="#f0f0f0" stroke="#78909C" stroke-width="1.5"/>
  <text x="495" y="117" text-anchor="middle" font-size="13" fill="#1a1a1a">再テスト</text>

  <!-- Right loop arrows -->
  <!-- バグ報告 → 原因分析 -->
  <line x1="700" y1="134" x2="705" y2="185" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 原因分析 → バグ修正 -->
  <line x1="680" y1="229" x2="660" y2="280" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- バグ修正 → 再テスト -->
  <path d="M 570 295 Q 500 340 495 324" fill="none" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 再テスト → バグ報告 -->
  <line x1="560" y1="112" x2="570" y2="112" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 再テスト → Hub -->
  <line x1="470" y1="134" x2="440" y2="175" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Hub → テスト設計 (feedback from hub) -->
  <path d="M 290 195 L 150 155 L 145 134" fill="none" stroke="#78909C" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Hub → バグ報告 (feedback from hub) -->
  <path d="M 490 195 L 620 155 L 625 134" fill="none" stroke="#78909C" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="250" y1="400" x2="290" y2="400" stroke="#78909C" stroke-width="1.5"/>
  <text x="300" y="405" font-size="12" fill="#666">処理の流れ</text>
  <line x1="400" y1="400" x2="440" y2="400" stroke="#78909C" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="450" y="405" font-size="12" fill="#666">カタログからのフィードバック</text>
</svg>
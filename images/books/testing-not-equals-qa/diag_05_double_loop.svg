<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="390" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">テスト／QCダブルループ</text>

  <!-- ===== Left loop: テストループ（設計→実行→記録→観点更新→設計） ===== -->
  <rect x="20" y="96" width="110" height="44" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="75" y="123" text-anchor="middle" font-size="13" fill="#1a1a1a">テスト設計</text>

  <rect x="20" y="236" width="110" height="44" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="75" y="263" text-anchor="middle" font-size="13" fill="#1a1a1a">テスト実行</text>

  <rect x="170" y="236" width="110" height="44" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="225" y="263" text-anchor="middle" font-size="13" fill="#1a1a1a">結果記録</text>

  <rect x="170" y="96" width="110" height="44" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="225" y="123" text-anchor="middle" font-size="13" fill="#1a1a1a">観点更新</text>

  <line x1="75" y1="140" x2="75" y2="234" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="130" y1="258" x2="168" y2="258" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="225" y1="236" x2="225" y2="142" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="118" x2="132" y2="118" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="150" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">テストループ（測る）</text>

  <!-- ===== Right loop: QCループ（報告→原因分析→修正→再テスト→報告） ===== -->
  <rect x="500" y="236" width="110" height="44" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="555" y="263" text-anchor="middle" font-size="13" fill="#1a1a1a">バグ報告</text>

  <rect x="500" y="96" width="110" height="44" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="555" y="123" text-anchor="middle" font-size="13" fill="#1a1a1a">原因分析</text>

  <rect x="650" y="96" width="110" height="44" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="705" y="123" text-anchor="middle" font-size="13" fill="#1a1a1a">バグ修正</text>

  <rect x="650" y="236" width="110" height="44" rx="6" fill="#F5F5F5" stroke="#78909C" stroke-width="1.5"/>
  <text x="705" y="263" text-anchor="middle" font-size="13" fill="#1a1a1a">再テスト</text>

  <line x1="555" y1="236" x2="555" y2="142" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="118" x2="648" y2="118" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="705" y1="140" x2="705" y2="234" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="258" x2="612" y2="258" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="630" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">QCループ（診る）</text>

  <!-- ===== Center hub ===== -->
  <rect x="300" y="160" width="180" height="60" rx="8" fill="#E8F5E9" stroke="#F9A825" stroke-width="2"/>
  <text x="390" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">テスト観点カタログ</text>
  <text x="390" y="207" text-anchor="middle" font-size="11" fill="#666">（ハブ）</text>

  <!-- 蓄積: 観点更新 → カタログ, 原因分析 → カタログ -->
  <line x1="280" y1="128" x2="320" y2="158" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="128" x2="460" y2="158" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- フィードバック: カタログ → テスト設計（上を回る）, カタログ → バグ報告（下を回る） -->
  <path d="M 390 160 L 390 70 L 75 70 L 75 94" fill="none" stroke="#78909C" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <path d="M 390 220 L 390 345 L 555 345 L 555 282" fill="none" stroke="#78909C" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="190" y1="400" x2="230" y2="400" stroke="#78909C" stroke-width="1.5"/>
  <text x="240" y="405" font-size="12" fill="#666">処理の流れ・カタログへの蓄積</text>
  <line x1="430" y1="400" x2="470" y2="400" stroke="#78909C" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="480" y="405" font-size="12" fill="#666">カタログからのフィードバック</text>
</svg>

  <text x="150" y="406" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">低</text>
  <rect x="190" y="100" width="180" height="120" fill="#FFF3C4" stroke="#ffffff" stroke-width="3" rx="3"/>
  <text x="280" y="165" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a">通常テスト</text>
  <rect x="370" y="100" width="180" height="120" fill="#F9A825" stroke="#ffffff" stroke-width="3" rx="3"/>

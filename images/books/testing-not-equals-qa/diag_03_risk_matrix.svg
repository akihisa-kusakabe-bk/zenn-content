<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 540" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <rect width="750" height="540" fill="#ffffff"/>

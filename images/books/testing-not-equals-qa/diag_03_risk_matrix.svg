  <rect x="370" y="340" width="180" height="120" fill="#E8F5E9" stroke="#ffffff" stroke-width="3" rx="3"/>
  <text x="460" y="405" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a">最低限</text>
  <rect x="550" y="340" width="180" height="120" fill="#FFF3C4" stroke="#ffffff" stroke-width="3" rx="3"/>
  <text x="640" y="405" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a">通常テスト</text>
  <text x="280" y="486" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">低</text>
  <text x="460" y="486" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">中</text>
  <text x="640" y="486" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">高</text>

  <rect x="190" y="220" width="180" height="120" fill="#E8F5E9" stroke="#ffffff" stroke-width="3" rx="3"/>
  <text x="280" y="285" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a">最低限</text>
  <rect x="370" y="220" width="180" height="120" fill="#FFF3C4" stroke="#ffffff" stroke-width="3" rx="3"/>
  <text x="460" y="285" text-anchor="middle" font-size="14" font-weight="normal" fill="#1a1a1a">通常テスト</text>
  <rect x="550" y="220" width="180" height="120" fill="#FFCC80" stroke="#ffffff" stroke-width="3" rx="3"/>
  <text x="640" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">重点テスト</text>
  <rect x="190" y="340" width="180" height="120" fill="#F5F5F5" stroke="#ffffff" stroke-width="3" rx="3"/>

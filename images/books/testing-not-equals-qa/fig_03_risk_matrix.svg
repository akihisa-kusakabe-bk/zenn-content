<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <rect width="740" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="370" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">リスクマトリクス</text>
  <text x="370" y="58" text-anchor="middle" font-size="13" fill="#666">リスクの高さ ＝ 発生確率 × 影響度</text>

  <!-- Y axis label -->
  <text x="35" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" transform="rotate(-90,35,190)">影響度</text>

  <!-- Y axis ticks -->
  <text x="80" y="130" text-anchor="end" font-size="12" fill="#555">高</text>
  <text x="80" y="200" text-anchor="end" font-size="12" fill="#555">中</text>
  <text x="80" y="270" text-anchor="end" font-size="12" fill="#555">低</text>

  <!-- Row 1 (High impact) -->
  <rect x="95" y="85" width="170" height="70" fill="#FFF3C4" stroke="#fff" stroke-width="2"/>
  <text x="180" y="125" text-anchor="middle" font-size="12" fill="#333">中リスク</text>

  <rect x="265" y="85" width="170" height="70" fill="#FFCC80" stroke="#fff" stroke-width="2"/>
  <text x="350" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">高リスク</text>

  <rect x="435" y="85" width="170" height="70" fill="#F9A825" stroke="#fff" stroke-width="2"/>
  <text x="520" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">最高リスク</text>
  <text x="520" y="140" text-anchor="middle" font-size="11" fill="#333">重点テスト対象</text>

  <!-- Row 2 (Medium impact) -->
  <rect x="95" y="155" width="170" height="70" fill="#E8F5E9" stroke="#fff" stroke-width="2"/>
  <text x="180" y="195" text-anchor="middle" font-size="12" fill="#333">低リスク</text>

  <rect x="265" y="155" width="170" height="70" fill="#FFF3C4" stroke="#fff" stroke-width="2"/>
  <text x="350" y="195" text-anchor="middle" font-size="12" fill="#333">中リスク</text>

  <rect x="435" y="155" width="170" height="70" fill="#FFCC80" stroke="#fff" stroke-width="2"/>
  <text x="520" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">高リスク</text>

  <!-- Row 3 (Low impact) -->
  <rect x="95" y="225" width="170" height="70" fill="#F5F5F5" stroke="#fff" stroke-width="2"/>
  <text x="180" y="265" text-anchor="middle" font-size="12" fill="#555">最低リスク</text>

  <rect x="265" y="225" width="170" height="70" fill="#E8F5E9" stroke="#fff" stroke-width="2"/>
  <text x="350" y="265" text-anchor="middle" font-size="12" fill="#333">低リスク</text>

  <rect x="435" y="225" width="170" height="70" fill="#FFF3C4" stroke="#fff" stroke-width="2"/>
  <text x="520" y="265" text-anchor="middle" font-size="12" fill="#333">中リスク</text>

  <!-- X axis ticks (directly under grid) -->
  <text x="180" y="316" text-anchor="middle" font-size="12" fill="#555">低</text>
  <text x="350" y="316" text-anchor="middle" font-size="12" fill="#555">中</text>
  <text x="520" y="316" text-anchor="middle" font-size="12" fill="#555">高</text>

  <!-- X axis label -->
  <text x="350" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">発生確率</text>

  <!-- Example annotation -->
  <rect x="95" y="368" width="510" height="40" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="350" y="393" text-anchor="middle" font-size="12" fill="#444">この表が1枚あれば「なぜこの機能を重点テストするのか」を説明できる</text>
</svg>

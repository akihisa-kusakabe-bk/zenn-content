<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 200" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#2980B9"/>
    </marker>
  </defs>

  <rect width="750" height="200" fill="#ffffff"/>

  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">時間軸の進化</text>

  <!-- Main timeline arrow -->
  <line x1="60" y1="80" x2="700" y2="80" stroke="#E67E22" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Time points -->
  <circle cx="140" cy="80" r="5" fill="#E67E22"/>
  <circle cx="310" cy="80" r="5" fill="#E67E22"/>
  <circle cx="480" cy="80" r="5" fill="#E67E22"/>
  <circle cx="640" cy="80" r="5" fill="#E67E22"/>

  <!-- Time labels (above) -->
  <text x="140" y="65" text-anchor="middle" font-size="13" fill="#555">過去</text>
  <text x="310" y="65" text-anchor="middle" font-size="13" fill="#555">現在</text>
  <text x="480" y="65" text-anchor="middle" font-size="13" fill="#555">近い未来</text>
  <text x="640" y="65" text-anchor="middle" font-size="13" fill="#555">遠い未来</text>

  <!-- Activity labels (below) -->
  <!-- Test -->
  <rect x="80" y="100" width="120" height="44" rx="6" fill="#E8F5E9" stroke="#27AE60" stroke-width="1.5"/>
  <text x="140" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">テスト</text>
  <text x="140" y="137" text-anchor="middle" font-size="12" fill="#555">（測る）</text>

  <!-- QC -->
  <rect x="250" y="100" width="120" height="44" rx="6" fill="#E8F5E9" stroke="#27AE60" stroke-width="1.5"/>
  <text x="310" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">QC</text>
  <text x="310" y="137" text-anchor="middle" font-size="12" fill="#555">（診る）</text>

  <!-- QA -->
  <rect x="420" y="100" width="120" height="44" rx="6" fill="#E8F5E9" stroke="#27AE60" stroke-width="1.5"/>
  <text x="480" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">QA</text>
  <text x="480" y="137" text-anchor="middle" font-size="12" fill="#555">（仕込む）</text>

  <!-- Scope bracket -->
  <line x1="80" y1="160" x2="540" y2="160" stroke="#E67E22" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="580" y="165" font-size="12" fill="#999">スコープ拡大 →</text>
</svg>